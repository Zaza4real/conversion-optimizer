# Used when the Railway service root is the monorepo root (not apps/backend).
# No build phase: committed dist/ artefacts are used directly via node dist/main.js.

[build]
builder = "nixpacks"

[deploy]
startCommand = "cd apps/backend && node dist/main.js"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
