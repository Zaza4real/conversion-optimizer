# Used when the Railway service root is the monorepo root (not apps/backend).
# Nixpacks + nixpacks.toml run install/build in apps/backend. Deploy hooks use the same cwd.

[build]
builder = "nixpacks"
buildCommand = "cd apps/backend && npm ci --ignore-scripts && npm run build"

[deploy]
startCommand = "cd apps/backend && npm run start"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
preDeployCommand = "cd apps/backend && node run-recommendations-index-migration.js"
