# Railway config (monorepo root).
# buildCommand replaces ALL Nixpacks auto-detected install/build steps.
# This avoids pnpm-detection failures from root package.json/pnpm-lock.yaml.

[build]
builder = "nixpacks"
buildCommand = "cd apps/backend && npm ci --ignore-scripts && npm run build"

[deploy]
startCommand = "cd apps/backend && node dist/main.js"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
