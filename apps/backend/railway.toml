# Railway config when the service Root Directory is **apps/backend** (lockfile + npm ci here).
# If the Root Directory is the **monorepo root**, use /railway.toml and /nixpacks.toml instead.

[build]
builder = "nixpacks"
buildCommand = "npm install && npm run build"

[deploy]
startCommand = "npm run start"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
# Run DB migration (recommendations index) before each deploy. Uses DATABASE_URL from Railway.
preDeployCommand = "node run-recommendations-index-migration.js"
